{% extends 'base.html' %}

{% block content %}
<div class="header-action">
    <h1>Confirmer la suppression</h1>
</div>

<div class="card" style="max-width: 500px; margin-top: 20px;">
    <p style="color: var(--danger); font-weight: bold; margin-bottom: 20px;">
        Etes-vous sur de vouloir supprimer definitivement la musique: {{ music.fichier.name }} ? Cette action est irreversible.
    </p>
    
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn-danger">Oui, Supprimer</button>
        <a href="{% url 'music_list' %}" class="btn-secondary" style="margin-left: 10px;">Annuler</a>
    </form>
</div>
{% endblock %}
