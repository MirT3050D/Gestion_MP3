{% extends 'base.html' %}

{% block content %}
<div class="header-action">
    <h1>Confirmer la suppression</h1>
</div>

<div class="card p-4 delete-wrapper">
    <div class="alert alert-danger mb-4">
        <strong>Attention :</strong> Êtes-vous sûr de vouloir supprimer définitivement la musique <em>{{ music.fichier.name }}</em> ? Cette action est irréversible.
    </div>
    
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn-danger">Oui, Supprimer</button>
        <a href="{% url 'music_list' %}" class="btn-text ml-2">Annuler</a>
    </form>
</div>
{% endblock %}
