{% extends 'base_auth.html' %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-container">
        <div style="margin-bottom: 2rem; display: inline-flex; align-items: center; gap: 0.5rem; font-size: 1.5rem; font-weight: 700;">
            <i class="ph-fill ph-music-note" style="color: var(--accent); font-size: 2rem;"></i> MP3 Studio
        </div>
        <p class="auth-subtitle">Accédez à votre bibliothèque musicale</p>
        
        {% if form.errors %}
            <div class="alert alert-error">Identifiant ou mot de passe incorrect.</div>
        {% endif %}
        
        <form method="post" class="auth-form">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_username">Nom d'utilisateur</label>
                {{ form.username }}
            </div>
            <div class="form-group">
                <label for="id_password">Mot de passe</label>
                {{ form.password }}
            </div>
            <button type="submit" class="btn-primary w-100">Se connecter</button>
        </form>
        
        <p style="margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-secondary);">
            Pas encore de compte ? <a href="{% url 'register' %}" style="color: var(--accent); text-decoration: none; font-weight: 500;">S'inscrire</a>
        </p>
    </div>
</div>
{% endblock %}
