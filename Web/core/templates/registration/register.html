{% extends 'base_auth.html' %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-container">
        <div style="margin-bottom: 2rem; display: inline-flex; align-items: center; gap: 0.5rem; font-size: 1.5rem; font-weight: 700;">
            <i class="ph-fill ph-music-note" style="color: var(--accent); font-size: 2rem;"></i> MP3 Studio
        </div>
        <p class="auth-subtitle">Créez votre compte gratuit</p>
        
        <form method="post" class="auth-form" style="text-align: left;">
            {% csrf_token %}
            {% for field in form %}
            <div class="form-group">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                <div style="color: var(--danger); font-size: 0.8rem; margin-top: 0.25rem;">
                    {{ field.errors|striptags }}
                </div>
                {% endif %}
            </div>
            {% endfor %}
            <button type="submit" class="btn-primary w-100 mt-2">S'inscrire</button>
        </form>
        
        <p style="margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-secondary);">
            Déjà un compte ? <a href="{% url 'login' %}" style="color: var(--accent); text-decoration: none; font-weight: 500;">Se connecter</a>
        </p>
    </div>
</div>
{% endblock %}
